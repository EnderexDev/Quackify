[package]
name = "quackify"
version = "1.0.5"
license = "MIT"
description = "Quackify: a yellow, duck-flavoured Spotify client for Windows"
authors = ["EnderexDev"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quackify_lib"
# Only the rlib: staticlib and cdylib exist for Tauri's mobile targets, and the desktop exe
# links the rlib. Each extra type was built (and LTO'd in release) again for nothing:
# Quackify's release build went from 304 s to 247 s, same exe (measured 08/11/26).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: Window::add_child, for the web player inside the window (webplayer.rs).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librespot-core = "0.8"
librespot-playback = "0.8"
librespot-audio = "0.8"
librespot-oauth = "0.8"
librespot-metadata = "0.8"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
regex = "1"
librespot-connect = "0.8"
librespot-protocol = "0.8"
futures-util = "0.3"
http = "1"
protobuf = "3.7"
souvlaki = { version = "0.8", default-features = false }
auto-launch = "0.6"
# The version rodio already pulls in through librespot: Quackify's own output (meter.rs).
cpal = "0.16"
# The decoder librespot already uses, with its features: the waveform ahead (waveform.rs).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# The versions librespot already pulls in: the listening report (listening.rs).
flate2 = "1"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
# The log file (logs.rs); log is the version librespot already pulls in.
# The log file (logs.rs); log is the version librespot already pulls in.
tauri-plugin-log = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# The version Tauri already pulls in: the taskbar thumbnail's buttons (thumbbar.rs) and the
# mouse button the mini player's snap waits for (mini.rs).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Dev builds (cargo build, tauri dev, cargo test): line numbers only for this crate, so panics
# and backtraces still name file:line, and no debug info for dependencies. Writing and linking
# full debug info was half of every rebuild: Quackify's one-line rebuild went from 16.9 s to
# 8.8 s and its clean build from 87 s to 59 s (measured 08/11/26). Release is untouched.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
